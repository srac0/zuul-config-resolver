[project]
name = "config-resolver"
version = "0.1.0"
description = "Resolve Zuul job variables through the parent inheritance chain"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "deepdiff>=9.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
config-resolver = "config_resolver.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "PIE",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
